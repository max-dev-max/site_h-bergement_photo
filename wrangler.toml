name = "foyer-photos"
main = "src/index.ts"
compatibility_date = "2026-08-22"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "foyer-photos"
database_id = "local-dev-foyer-photos"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "PHOTOS"
bucket_name = "foyer-photos"

[images]
binding = "IMAGES"
